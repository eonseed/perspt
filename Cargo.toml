# Cargo.toml - Perspt Workspace
[workspace]
resolver = "2"
members = [
    "crates/perspt-core",
    "crates/perspt-sdk",
    "crates/perspt-coding",
    "crates/perspt-research",
    "crates/perspt-tui",
    "crates/perspt-agent",
    "crates/perspt-policy",
    "crates/perspt-sandbox",
    "crates/perspt-cli",
    "crates/perspt-store",
    "crates/perspt-dashboard",
    "crates/perspt-prompt-macros",
    "crates/perspt",
    # Dev-only repository automation (PSP code check). Never published.
    "xtask",
]

[workspace.package]
version = "0.6.6"
edition = "2021"
rust-version = "1.97"
authors = ["Vikrant Rathore", "Ronak Rathore"]
license = "LGPL-3.0-only"
repository = "https://github.com/eonseed/perspt"
homepage = "https://eonseed.github.io/perspt/"

[workspace.dependencies]
perspt-core = { version = "0.6.6", path = "crates/perspt-core" }
perspt-sdk = { version = "0.6.6", path = "crates/perspt-sdk" }
perspt-prompt-macros = { version = "0.6.6", path = "crates/perspt-prompt-macros" }
perspt-coding = { version = "0.6.6", path = "crates/perspt-coding" }
perspt-research = { version = "0.6.6", path = "crates/perspt-research" }
perspt-agent = { version = "0.6.6", path = "crates/perspt-agent" }
perspt-tui = { version = "0.6.6", path = "crates/perspt-tui" }
perspt-policy = { version = "0.6.6", path = "crates/perspt-policy" }
perspt-sandbox = { version = "0.6.6", path = "crates/perspt-sandbox" }
perspt-store = { version = "0.6.6", path = "crates/perspt-store" }
perspt-cli = { version = "0.6.6", path = "crates/perspt-cli" }
perspt-dashboard = { version = "0.6.6", path = "crates/perspt-dashboard" }
perspt = { version = "0.6.6", path = "crates/perspt" }

# Exact-pinned to avoid libduckdb-sys recompilation on `cargo update`.
# Only changes when you explicitly bump the version here.
# NOTE: `bundled` is NOT a default feature. Local dev links against system libduckdb
# (fast). CI and release builds use `--all-features` or `--features bundled` to
# compile DuckDB from source for a fully self-contained binary.
duckdb = { version = "=1.10505.0" }

# Shared third-party dependencies. Keeping these here makes direct-version
# drift visible in one review and prevents duplicate majors across crates.
anyhow = "1.0"
async-trait = "0.1.89"
dirs = "6.0"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
futures = "0.3"
lsp-types = "0.97"
shell-words = "1.1"
similar = "3.0"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.52", features = ["full"] }
tempfile = "3.27"
rustix = { version = "1.1", features = ["fs"] }
uuid = { version = "1.23", features = ["v4"] }
