name: PSP Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/psps/**"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-psp-pr:
    name: Validate PSP Catalog (guidedog dsc)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_psp_records: ${{ steps.detect.outputs.has_psp_records }}
      psp_id: ${{ steps.detect.outputs.psp_id }}
      psp_title: ${{ steps.detect.outputs.psp_title }}
      psp_state: ${{ steps.detect.outputs.psp_state }}
      psp_type: ${{ steps.detect.outputs.psp_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Guidedog
        uses: ./.github/actions/guidedog

      - name: Detect modified PSP records
        id: detect
        run: |
          records=$(git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -E '^docs/psps/records/([0-9]{6}|XXXXX)-.*\.rst$' || true)
          if [ -z "$records" ]; then
            echo "has_psp_records=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_psp_records=true" >> "$GITHUB_OUTPUT"
          record=$(echo "$records" | head -1)
          header=$(head -25 "$record")
          psp_id=$(echo "$header" | grep "^:psp-number:" | sed 's/:psp-number: *//' | tr -d '\r\n')
          psp_title=$(echo "$header" | grep "^:psp-title:" | sed 's/:psp-title: *//' | tr -d '\r\n')
          psp_state=$(echo "$header" | grep "^:psp-state:" | sed 's/:psp-state: *//' | tr -d '\r\n')
          psp_type=$(echo "$header" | grep "^:psp-type:" | sed 's/:psp-type: *//' | tr -d '\r\n')
          echo "psp_id=$psp_id" >> "$GITHUB_OUTPUT"
          echo "psp_title=$psp_title" >> "$GITHUB_OUTPUT"
          echo "psp_state=$psp_state" >> "$GITHUB_OUTPUT"
          echo "psp_type=$psp_type" >> "$GITHUB_OUTPUT"

      - name: Validate PSP governance and build HTML + PDF
        run: |
          guidedog dsc check --dir=docs/psps
          guidedog dsc build --dir=docs/psps
          guidedog build html docs/psps -W -n

  comment-on-psp-pr:
    name: Comment on PSP Pull Request
    needs: validate-psp-pr
    if: needs.validate-psp-pr.outputs.has_psp_records == 'true' && github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Add PSP validation summary comment
        uses: actions/github-script@v9
        with:
          script: |
            const pspId = '${{ needs.validate-psp-pr.outputs.psp_id }}';
            const pspTitle = '${{ needs.validate-psp-pr.outputs.psp_title }}';
            const pspState = '${{ needs.validate-psp-pr.outputs.psp_state }}';
            const pspType = '${{ needs.validate-psp-pr.outputs.psp_type }}';

            const body = `## 📋 PSP Record Detected: PSP-${pspId}

            - **Title:** ${pspTitle}
            - **State:** \`${pspState}\`
            - **Type:** \`${pspType}\`

            \`guidedog dsc check --dir=docs/psps\` and \`guidedog dsc build --dir=docs/psps\` verified the record metadata, reading order, HTML output, and Typst PDF compilation.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  comment-on-psp-proposal-issue:
    name: Welcome PSP Proposal Issue
    if: github.event_name == 'issues' && github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'psp-proposal')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Add PSP authoring guidance
        uses: actions/github-script@v9
        with:
          script: |
            const body = `👋 **Thank you for proposing a Perspt Specification Proposal (PSP)!**

            When ready to author the formal specification record using **Guidedog**:

            \`\`\`bash
            guidedog dsc new "Your PSP Title" --dir=docs/psps
            guidedog dsc index --dir=docs/psps
            guidedog dsc check --dir=docs/psps
            \`\`\`

            Maintainers assign proposal numbers and change lifecycle states in reviewed pull requests. Merging a draft does not promote it.

            See [docs/psps/README.rst](docs/psps/README.rst) and [PSP-000001](docs/psps/records/000001-psp-purpose-and-guidelines.rst) for full guidelines.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
