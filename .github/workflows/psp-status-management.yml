name: PSP Review Reminders

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-stale-psps:
    name: Report PSPs awaiting review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List discussion records unchanged for 60 days
        run: |
          set -euo pipefail
          psp_cutoff=$(date -d '60 days ago' +%s)
          psp_stale_count=0
          printf '## PSPs awaiting maintainer review\n\n' >> "$GITHUB_STEP_SUMMARY"
          for psp_file in docs/psps/records/[0-9][0-9][0-9][0-9][0-9][0-9]-*.rst; do
            [ -f "$psp_file" ] || continue
            psp_state=$(sed -n 's/^:psp-state: *//p' "$psp_file" | tr -d '\r')
            psp_updated=$(sed -n 's/^:psp-updated: *//p' "$psp_file" | tr -d '\r')
            psp_number=$(sed -n 's/^:psp-number: *//p' "$psp_file" | tr -d '\r')
            if [ "$psp_state" = "discussion" ] && [[ "$psp_updated" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              psp_updated_at=$(date -d "$psp_updated" +%s)
              if [ "$psp_updated_at" -lt "$psp_cutoff" ]; then
                printf -- '- PSP-%s (last updated %s)\n' "$psp_number" "$psp_updated" >> "$GITHUB_STEP_SUMMARY"
                psp_stale_count=$((psp_stale_count + 1))
              fi
            fi
          done
          if [ "$psp_stale_count" -eq 0 ]; then
            printf 'No discussion records have been unchanged for 60 days.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nMaintainers decide when to number proposals and change their state. This workflow changes no records.\n' >> "$GITHUB_STEP_SUMMARY"
