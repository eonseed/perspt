name: PSP Status Management

on:
  issues:
    types: [closed]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      psp_number:
        description: "PSP number to transition (e.g. 000011)"
        required: true
        type: string
      new_state:
        description: "Target PSP state"
        required: true
        type: choice
        options:
          - discussion
          - accepted
          - active
          - final
          - rejected
          - withdrawn
          - deferred
      reason:
        description: "Reason for state transition"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  transition-psp-state:
    name: Transition PSP State via guidedog dsc
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Guidedog
        uses: ./.github/actions/guidedog

      - name: Transition state and refresh catalog index
        env:
          PSP_NUMBER: ${{ github.event.inputs.psp_number }}
          NEW_STATE: ${{ github.event.inputs.new_state }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          if [ "$NEW_STATE" = "discussion" ]; then
            guidedog dsc promote "$PSP_NUMBER" --dir=docs/psps
          else
            guidedog dsc state "$PSP_NUMBER" "$NEW_STATE" --dir=docs/psps
          fi
          guidedog dsc index --dir=docs/psps
          guidedog dsc check --dir=docs/psps

          git config user.name "PSP Status Bot"
          git config user.email "action@github.com"
          git add docs/psps/
          if [ -n "$REASON" ]; then
            git commit -m "Update PSP-${PSP_NUMBER} state to ${NEW_STATE}" -m "$REASON"
          else
            git commit -m "Update PSP-${PSP_NUMBER} state to ${NEW_STATE}"
          fi
          git push origin master

  check-stale-psps:
    name: Check for Stale PSPs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Find stale discussion PSPs (>60 days)
        run: |
          current_date=$(date +%s)
          sixty_days_ago=$((current_date - 60*24*60*60))
          for psp_file in docs/psps/records/[0-9][0-9][0-9][0-9][0-9][0-9]-*.rst; do
            if [ -f "$psp_file" ]; then
              state=$(grep "^:psp-state:" "$psp_file" | sed 's/:psp-state: *//' | tr -d '\r\n')
              created=$(grep "^:psp-created:" "$psp_file" | sed 's/:psp-created: *//' | tr -d '\r\n')
              psp_number=$(grep "^:psp-number:" "$psp_file" | sed 's/:psp-number: *//' | tr -d '\r\n')
              if [ "$state" = "discussion" ] && [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                created_ts=$(date -d "$created" +%s 2>/dev/null || echo "0")
                if [ "$created_ts" -lt "$sixty_days_ago" ]; then
                  echo "$psp_number" >> stale_psps.txt
                fi
              fi
            fi
          done
