name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        default: "v0.5.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.tag_name.outputs.TAG_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Get tag name
        id: tag_name
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG_NAME }}
          name: Release ${{ steps.tag_name.outputs.TAG_NAME }}
          generate_release_notes: true
          body: |
            ## Downloads
            - **Linux (x86_64)**: `perspt-linux-x86_64`
            - **Windows (x86_64)**: `perspt-windows-x86_64.exe`
            - **macOS (x86_64)**: `perspt-macos-x86_64`
            - **macOS (ARM64)**: `perspt-macos-arm64`

            ## Installation
            1. Download the appropriate binary for your platform
            2. Make it executable (Linux/macOS): `chmod +x perspt-*`
            3. Move to your PATH: `sudo mv perspt-* /usr/local/bin/perspt`

            Native Windows supports chat, MCP, and coding. Coding processes
            fail closed by default because Perspt has no native Windows sandbox;
            use `perspt agent --allow-unisolated ...` only after accepting that
            reduced-isolation mode, or use WSL for OS isolation.

            ## Documentation
            See the [documentation](https://eonseed.github.io/perspt/) for detailed usage instructions.
          draft: false
          prerelease: true

  build-release:
    name: Build Release Binary
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CXXFLAGS: ${{ startsWith(matrix.target, 'x86_64-pc-windows-msvc') && '/std:c++17 /EHsc' || '' }}
      CMAKE_CXX_FLAGS: ${{ startsWith(matrix.target, 'x86_64-pc-windows-msvc') && '/std:c++17 /EHsc' || '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: perspt
            asset_name: perspt-linux-x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_name: perspt.exe
            asset_name: perspt-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: perspt
            asset_name: perspt-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: perspt
            asset_name: perspt-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --all-features --target ${{ matrix.target }} -p perspt-cli

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-2022'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Rename binary for release
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release-assets/${{ matrix.asset_name }}

  build-documentation:
    name: Build and Upload Documentation
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
      PERSPT_DOCS_CI_FONTS: 1
      PERSPT_SKIP_DASHBOARD_ASSETS: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install pinned DuckDB
        uses: ./.github/actions/setup-duckdb

      - name: Install documentation system packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            graphviz \
            fonts-freefont-otf \
            latexmk \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-liberation \
            fonts-dejavu \
            fonts-noto-cjk \
            fontconfig

      - name: Build Rust documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build Sphinx HTML documentation
        working-directory: docs/perspt_book
        run: uv run --locked sphinx-build -W --keep-going -b html source build/html
        env:
          CI: 1

      - name: Build Sphinx PDF documentation
        run: |
          cd docs/perspt_book
          # Generate and compile the release-only PDF. Routine pull requests
          # build strict HTML and do not install the LaTeX toolchain.
          export CI=true
          export GITHUB_ACTIONS=true
          uv run --locked sphinx-build -W --keep-going -b latex source build/latex
          make -C build/latex

      - name: Package documentation
        run: |
          mkdir -p documentation-package
          cp -r target/doc documentation-package/rust-docs
          cp -r docs/perspt_book/build/html documentation-package/sphinx-html
          cp docs/perspt_book/build/latex/*.pdf documentation-package/ 2>/dev/null || true
          cd documentation-package
          zip -r ../documentation.zip .

      - name: Upload Documentation Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: documentation.zip

  checksums:
    name: Generate Checksums
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release assets
        run: |
          # Get the tag name
          TAG_NAME="${{ needs.create-release.outputs.tag_name }}"

          # Download all binary assets with retries
          for asset in "perspt-linux-x86_64" "perspt-windows-x86_64.exe" "perspt-macos-x86_64" "perspt-macos-arm64"; do
            for i in {1..5}; do
              if curl -L -f -o "$asset" \
                "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${asset}"; then
                echo "Successfully downloaded $asset"
                break
              else
                echo "Attempt $i failed for $asset, retrying in 10 seconds..."
                sleep 10
              fi
            done
          done

      - name: Generate checksums
        run: |
          for file in perspt-*; do
            if [[ -f "$file" ]]; then
              sha256sum "$file" >> checksums.txt
            fi
          done

      - name: Upload Checksums
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: checksums.txt
