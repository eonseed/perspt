name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      cross_platform:
        description: Run the Windows and macOS merge matrix
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR commits are disposable. Merge-queue and protected-branch
  # runs are evidence for a specific commit and must be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
  PERSPT_SKIP_DASHBOARD_ASSETS: 1

jobs:
  quality:
    name: PR gate (Ubuntu)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Linux governed verifiers fail closed when their process-isolation
      # backend is unavailable. GitHub's Ubuntu 24.04 image omits Bubblewrap
      # and prevents unconfined processes from creating user namespaces. The
      # runner is ephemeral and already executes the workspace test binaries;
      # Bubblewrap still supplies the verifier's filesystem and network policy.
      - name: Install the Linux verifier sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined ]]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_unconfined=0
          fi
          bwrap --die-with-parent --unshare-net --ro-bind / / /bin/true

      - name: Install pinned DuckDB
        uses: ./.github/actions/setup-duckdb

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Verify the governed verifier sandbox
        shell: bash
        run: |
          probe_root="$(mktemp -d)"
          cargo_bin_root="${CARGO_HOME:-$HOME/.cargo}/bin"
          rustup_root="${RUSTUP_HOME:-$HOME/.rustup}"
          rustc_path="$(rustup which rustc)"
          cargo init --lib --quiet --name verifier-probe "$probe_root"
          mkdir -p "$probe_root/.perspt-home" "$probe_root/.perspt-target" "$probe_root/.perspt-tmp"
          bwrap \
            --die-with-parent \
            --unshare-net \
            --ro-bind / / \
            --tmpfs /home \
            --tmpfs /tmp \
            --dir "$HOME" \
            --dir "${CARGO_HOME:-$HOME/.cargo}" \
            --ro-bind "$cargo_bin_root" "$cargo_bin_root" \
            --ro-bind "$rustup_root" "$rustup_root" \
            --bind "$probe_root" "$probe_root" \
            --chdir "$probe_root" \
            /bin/sh -c '
              id
              cat /proc/self/attr/current
              namei -l "$1"
              findmnt --target "$1" --output TARGET,VFS-OPTIONS,FS-OPTIONS
              ls -l "$1"
              "$1" -vV
              rustc -vV
              if ! HOME="$2/.perspt-home" \
                CARGO_HOME="$3" \
                RUSTUP_HOME="$4" \
                CARGO_TARGET_DIR="$2/.perspt-target" \
                TMPDIR="$2/.perspt-tmp" \
                strace -f -s 256 -e trace=process -o "$2/cargo.trace" \
                  cargo check --offline; then
                cat "$2/cargo.trace"
                exit 1
              fi
            ' probe "$rustc_path" "$probe_root" "${CARGO_HOME:-$HOME/.cargo}" "$rustup_root"

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.97.1-pr-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-pr-
            ${{ runner.os }}-rust-1.97.1-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The official pinned shared library keeps native compilation out of
      # routine CI. Clippy compiles the workspace, so cargo build is redundant.
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run credential-free tests
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

      - name: Check the optional benchmark CLI
        run: cargo check --locked --package perspt-cli --features benchmark

      - name: Check Rust API documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  code-rules:
    name: PSP code rules
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.97.1-rules-${{ hashFiles('Cargo.lock', 'xtask/**') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-rules-

      - name: Enforce the PSP code-rule baseline
        run: cargo run --locked --quiet --package xtask -- check

      - name: Publish the detailed rule report
        if: always()
        run: cargo run --locked --quiet --package xtask -- report --format markdown >> "$GITHUB_STEP_SUMMARY"

  target-os:
    name: Target OS (${{ matrix.os }})
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.cross_platform)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is already covered by the PR gate above.
        os: [windows-2022, macos-latest]
    env:
      CXXFLAGS: ${{ matrix.os == 'windows-2022' && '/std:c++17 /EHsc' || '' }}
      CMAKE_CXX_FLAGS: ${{ matrix.os == 'windows-2022' && '/std:c++17 /EHsc' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pinned DuckDB
        uses: ./.github/actions/setup-duckdb

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.97.1-target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-target-
            ${{ runner.os }}-rust-1.97.1-

      - name: Run target-OS tests
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

      - name: Check the optional benchmark CLI
        run: cargo check --locked --package perspt-cli --features benchmark
