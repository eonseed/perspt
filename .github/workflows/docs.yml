# Adapted from `guidedog pages workflow` for Perspt's four-mount site + Rustdoc publication.
name: Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "xtask/**"
      - ".github/actions/guidedog/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/**"
      - "xtask/**"
      - ".github/actions/guidedog/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always
  PERSPT_SKIP_DASHBOARD_ASSETS: 1

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Guidedog
        uses: ./.github/actions/guidedog

      - name: Validate and build PSP catalog (HTML + Typst PDF)
        run: |
          guidedog dsc index --dir=docs/psps
          guidedog dsc check --dir=docs/psps
          guidedog dsc build --dir=docs/psps
          guidedog build html docs/psps -W -n

      - name: Strict Perspt Book validation
        run: guidedog build html docs/perspt_book -W -n

      - name: Build unified Guidedog website and PDF book
        run: |
          guidedog ssg build docs --out docs/_build/site
          mkdir -p docs/_build/site/psps/pdf
          cp docs/psps/_build/pdf/*.pdf docs/_build/site/psps/pdf/
          cp docs/_build/site/books/perspt-book-en.pdf docs/perspt.pdf
          test -s docs/_build/site/index.html
          test -s docs/_build/site/book/index.html
          test -s docs/_build/site/psps/index.html
          test -s docs/_build/site/books/perspt-book-en.pdf
          touch docs/_build/site/.nojekyll

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: docs/_build/site
          retention-days: 7
          if-no-files-found: error

      # PR CI already checks Rustdoc while its Cargo target is warm. Build it
      # here only when publishing the complete GitHub Pages tree on master.
      - name: Install the pinned Rust toolchain
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install pinned DuckDB
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/setup-duckdb

      - name: Cache Cargo registry and Rustdoc build artifacts
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-1.97.1-docs-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-docs-
            ${{ runner.os }}-rust-1.97.1-

      - name: Build Rust API documentation
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cargo doc --locked --workspace --no-deps
          cp -rn target/doc/* docs/_build/site/ || true
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/site

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Deploy the complete documentation site
        id: deployment
        uses: actions/deploy-pages@v5
