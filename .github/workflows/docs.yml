name: Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [master]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PERSPT_SKIP_DASHBOARD_ASSETS: 1

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.6"
          enable-cache: true

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz

      - name: Build the Perspt Book
        working-directory: docs/perspt_book
        run: uv run --locked sphinx-build -W --keep-going -b html source build/html
        env:
          CI: 1

      - name: Build and validate PSP documentation
        working-directory: docs/psps
        run: uv run --locked python build.py --fail-on-warning --jobs 2
        env:
          CI: 1

      # PR CI already checks Rustdoc while its Cargo target is warm. Build it
      # here only when this job will publish a complete Pages tree.
      - name: Install the pinned Rust toolchain
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Install pinned DuckDB
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/setup-duckdb

      - name: Cache Cargo downloads
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-1.97.1-docs-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.1-docs-
            ${{ runner.os }}-rust-1.97.1-

      - name: Build Rust API documentation
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Prepare one atomic Pages site
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site/book _site/psps
          cp docs/pages-index.html _site/index.html
          cp -R target/doc/. _site/
          cp -R docs/perspt_book/build/html/. _site/book/
          cp -R docs/psps/build/html/. _site/psps/

      - name: Configure GitHub Pages
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact
        if: >-
          github.ref == 'refs/heads/master' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy the complete documentation site
        id: deployment
        uses: actions/deploy-pages@v5
