name: Install Guidedog
# Derived from the installed publisher's `guidedog pages workflow` template.
description: Install the checksum-pinned Guidedog publisher with its embedded Typst PDF and Graphviz engines.
runs:
  using: composite
  steps:
    - name: Install Guidedog 1.0.0-beta.7
      shell: bash
      env:
        GUIDEDOG_VERSION: 1.0.0-beta.7
        GUIDEDOG_SHA256: a5ac102adada94e9919c3b0a0c18a162f6a470d023f0da0cf1db8c560c52a5dd
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/guidedog-linux-amd64.tar.gz"
        url="https://github.com/insanai/guidedog/releases/download/v${GUIDEDOG_VERSION}/guidedog-linux-amd64.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location "$url" -o "$archive"
        printf '%s  %s\n' "$GUIDEDOG_SHA256" "$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/guidedog"
        tar -xzf "$archive" -C "$RUNNER_TEMP/guidedog" --strip-components=1
        echo "$RUNNER_TEMP/guidedog" >> "$GITHUB_PATH"
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation
    - name: Publisher version
      shell: bash
      run: guidedog --version
