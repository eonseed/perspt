[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "LGPL-3.0-only"
description = "Repository automation for Perspt: PSP code check compliance"

# Dev-only tooling. This crate is never published, is not re-exported by the
# `perspt` meta-crate, and is not part of the shipped crate set described by
# PSP-9's Technical Specification.

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { workspace = true }
serde_json = { workspace = true }
syn = { version = "2.0.118", features = ["full", "visit", "parsing", "printing"] }
toml = { workspace = true }
walkdir = "2.5.0"
