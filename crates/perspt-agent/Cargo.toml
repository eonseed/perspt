[package]
name = "perspt-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SRBN Orchestrator and Agent logic for Perspt"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-agent"
keywords = ["agent", "srbn", "llm", "coding"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
bundled = ["perspt-store/bundled"]

[dependencies]
perspt-core = { workspace = true }
perspt-sdk = { workspace = true }
perspt-coding = { workspace = true }
perspt-policy = { workspace = true }
perspt-sandbox = { workspace = true }
perspt-store = { workspace = true }

# Content addressing for realized workspace snapshots
sha2 = "0.10"

# Graph management
petgraph = "0.8"

# LSP Client
lsp-types = "0.97"
url = "2.5"

# UUID for session IDs
uuid = { version = "1.11", features = ["v4"] }

# Async
async-trait = "0.1.88"
tokio = { version = "1.42", features = ["full", "process"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
log = "0.4"
# Code search (ripgrep library facade)
grep = "0.4"
ignore = "0.4"
regex = "1.12.2"
diffy = "0.5"
tempfile = "3.14"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
