[package]
name = "perspt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SRBN Orchestrator and Agent logic for Perspt"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-agent"
keywords = ["agent", "srbn", "llm", "coding"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
bundled = ["perspt-store/bundled", "duckdb/bundled"]

[dependencies]
perspt-core = { workspace = true }
perspt-sdk = { workspace = true }
perspt-coding = { workspace = true }
perspt-policy = { workspace = true }
perspt-sandbox = { workspace = true }
perspt-store = { workspace = true }

# Content addressing for realized workspace snapshots
sha2 = { workspace = true }

# LSP Client
lsp-types = { workspace = true }
url = "2.5"

# UUID for session IDs
uuid = { workspace = true }

# Async
async-trait = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
log = { workspace = true }
ignore = "0.4"
regex = "1.12.2"
diffy = "0.5"
duckdb = { workspace = true }
shell-words = { workspace = true }
futures = { workspace = true }
rustix = { workspace = true }
tempfile = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { workspace = true }

[dev-dependencies]
