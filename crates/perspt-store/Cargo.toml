[package]
name = "perspt-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DuckDB-based persistence layer for Perspt SRBN sessions"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-store"
keywords = ["persistence", "duckdb", "srbn", "session"]
categories = ["database"]

[features]
default = []
bundled = ["duckdb/bundled"]

[dependencies]
perspt-core = { workspace = true }

# DuckDB for persistence
duckdb = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID for session IDs
uuid = { version = "1.11", features = ["v4"] }

# Async
tokio = { version = "1.42", features = ["full"] }

# Logging
log = "0.4"

# Utilities
anyhow = "1.0"

# Hex encoding for Merkle hashes
hex = "0.4"

# Platform-specific directories
dirs = "5.0"
