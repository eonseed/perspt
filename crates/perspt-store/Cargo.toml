[package]
name = "perspt-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "DuckDB-based persistence layer for Perspt SRBN sessions"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-store"
keywords = ["persistence", "duckdb", "srbn", "session"]
categories = ["database"]

[features]
default = []
bundled = ["duckdb/bundled"]

[dependencies]
perspt-core = { workspace = true }

# DuckDB for persistence
duckdb = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUID for session IDs
uuid = { workspace = true }

# Async
tokio = { workspace = true }

# Logging
log = { workspace = true }

# Utilities
anyhow = { workspace = true }

# Hex encoding for Merkle hashes
hex = "0.4"
sha2 = { workspace = true }

# Platform-specific directories
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
