[package]
name = "perspt-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Ratatui-based TUI for Perspt"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-tui"
keywords = ["tui", "terminal", "ui", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
bundled = ["perspt-store/bundled", "perspt-agent/bundled"]

[dependencies]
perspt-core = { workspace = true }
perspt-agent = { workspace = true }
perspt-store = { workspace = true }

# UI components
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = "0.13"

# Async
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
serde_json = { workspace = true }
futures = { workspace = true }

# Rich Input
tui-textarea = { package = "tui-textarea-2", version = "0.11" }

# Diff Computation
similar = { workspace = true }

# Async Indicators (0.10.0 for ratatui 0.30 compat)
throbber-widgets-tui = "0.11"

# Markdown Rendering (terminal)
termimad = "0.34"

# Markdown to Ratatui Text
tui-markdown = { version = "0.3.8", default-features = false }

# Utilities
anyhow = "1.0"
log = "0.4"

# Text Wrapping for Virtual Scrolling
textwrap = "0.16"
unicode-width = "0.2"
