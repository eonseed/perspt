[package]
name = "perspt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI entry point for Perspt - A stability-aware AI coding assistant"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-cli"
keywords = ["cli", "ai", "llm", "coding", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "perspt"
path = "src/main.rs"
doc = false

[features]
default = []
bundled = [
    "perspt-store/bundled",
    "perspt-agent/bundled",
    "perspt-tui/bundled",
    "perspt-dashboard/bundled",
]
benchmark = ["dep:perspt-benchmark"]

[dependencies]
perspt-core = { workspace = true }
perspt-sdk = { workspace = true }
perspt-tui = { workspace = true }
perspt-agent = { workspace = true }
perspt-coding = { workspace = true }
perspt-prompt-macros = { workspace = true }
perspt-research = { workspace = true }
perspt-store = { workspace = true }
perspt-dashboard = { workspace = true }
perspt-benchmark = { workspace = true, optional = true }

# CLI
clap = { workspace = true }
rustyline = "18.0"

# Async
tokio = { workspace = true }

# TLS crypto provider selection (Vertex ADC via gcp_auth uses rustls/ring).
rustls = { version = "0.23", features = ["ring"] }

# Logging
log = { workspace = true }
env_logger = "0.11"

# Utilities
anyhow = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
axum = "0.8"
