[package]
name = "perspt-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI entry point for Perspt - A stability-aware AI coding assistant"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-cli"
keywords = ["cli", "ai", "llm", "coding", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "perspt"
path = "src/main.rs"
doc = false

[features]
default = []
bundled = [
    "perspt-store/bundled",
    "perspt-agent/bundled",
    "perspt-tui/bundled",
    "perspt-dashboard/bundled",
]

[dependencies]
perspt-core = { workspace = true }
perspt-sdk = { workspace = true }
perspt-tui = { workspace = true }
perspt-agent = { workspace = true }
perspt-store = { workspace = true }
perspt-dashboard = { workspace = true }

# CLI
clap = { version = "4.5", features = ["derive"] }
rustyline = "18.0"

# Async
tokio = { version = "1.42", features = ["full"] }

# TLS crypto provider selection (Vertex ADC via gcp_auth uses rustls/ring).
rustls = { version = "0.23", features = ["ring"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Utilities
anyhow = "1.0"
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"
dirs = "6.0"
axum = "0.8"
