[package]
name = "perspt-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Starlark execution policy engine for Perspt"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-policy"
keywords = ["policy", "starlark", "security", "rules"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Core types and path normalization
perspt-core = { workspace = true }
# Starlark policy engine
starlark = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Shell parsing
shell-words = "1.1"

# Home directory detection
dirs = "6.0"

# Utilities
anyhow = "1.0"
log = "0.4"

[dev-dependencies]
tempfile = "3.14"
