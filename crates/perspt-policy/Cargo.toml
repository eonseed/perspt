[package]
name = "perspt-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Starlark execution policy engine for Perspt"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-policy"
keywords = ["policy", "starlark", "security", "rules"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Core types and path normalization
perspt-core = { workspace = true }
# Starlark policy engine
starlark = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }

# Shell parsing
shell-words = { workspace = true }

# Home directory detection
dirs = { workspace = true }

# Utilities
anyhow = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
