[package]
name = "perspt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types and LLM provider abstraction for Perspt"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-core"
keywords = ["llm", "ai", "chat", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
perspt-sdk = { workspace = true }
# LLM unified interface
genai = "0.6.5"
futures = { workspace = true }

# Google Cloud Application Default Credentials (ADC) for Vertex AI auth.
# genai's Vertex adapter needs an OAuth2 Bearer token supplied via an
# AuthResolver; gcp_auth auto-detects ADC (gcloud login / service account /
# metadata server) so no static API key is required.
gcp_auth = "0.12"

# TOML configuration parsing/serialization
toml = { workspace = true }

# Core async and traits
async-trait = { workspace = true }
tokio = { workspace = true }

# Configuration
serde = { workspace = true }
serde_json = { workspace = true }

# LSP types for agent integration
lsp-types = { workspace = true }

# Logging
log = { workspace = true }

# UUID for session IDs
uuid = { workspace = true }

# Platform directories
dirs = { workspace = true }

# Utilities
anyhow = { workspace = true }

[build-dependencies]
perspt-prompt-macros = { workspace = true }
