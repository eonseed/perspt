[package]
name = "perspt-dashboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Real-time web dashboard for Perspt agent monitoring"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-dashboard"
keywords = ["dashboard", "monitoring", "web", "agent"]
categories = ["web-programming::http-server", "visualization"]

[features]
default = []
bundled = ["perspt-store/bundled"]

[dependencies]
perspt-store = { workspace = true }
perspt-core = { workspace = true }

axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
askama = "0.16"
tokio = { version = "1.42", features = ["full"] }
tokio-stream = { version = "0.1", features = ["time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3"
log = "0.4"
anyhow = "1.0"
rand = "0.10"
