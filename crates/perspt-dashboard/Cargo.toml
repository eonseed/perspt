[package]
name = "perspt-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Real-time web dashboard for Perspt agent monitoring"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/perspt-dashboard"
keywords = ["dashboard", "monitoring", "web", "agent"]
categories = ["web-programming::http-server", "visualization"]

[features]
default = []
bundled = ["perspt-store/bundled"]

[dependencies]
perspt-store = { workspace = true }
perspt-sdk = { workspace = true }

axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
askama = "0.16.1"
tokio = { workspace = true }
tokio-stream = { version = "0.1.19", features = ["time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rand = "0.10.3"
