[package]
name = "perspt-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Optional, credentialed evaluation tooling for Perspt"
repository.workspace = true
homepage.workspace = true
# The engine is publishable so perspt-cli's optional local benchmark feature
# resolves on crates.io. Hidden oracles and reference solutions stay private.
include = ["src/**"]

[dependencies]
perspt-agent = { workspace = true }
perspt-core = { workspace = true }
perspt-sdk = { workspace = true }
perspt-store = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
